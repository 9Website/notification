<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Enforcement Spammer</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --text: #f3f4f6;
            --danger: #dc2626;
            --success: #16a34a;
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-bg);
            border: 2px solid #374151;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start { background-color: var(--danger); color: white; }
        .btn-stop { background-color: var(--success); color: white; display: none; }

        /* Full screen flashing alert mode */
        body.flash-mode {
            animation: flashBg 0.5s infinite alternate;
        }

        @keyframes flashBg {
            from { background-color: var(--bg); }
            to { background-color: #7f1d1d; }
        }

        .popup-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>

<div id="topAlert" class="popup-alert">GET BACK TO WORK!</div>

<div class="container">
    <h2>Work Enforcer</h2>
    <p style="color: #9ca3af; font-size: 0.9rem;">Bypasses browser limits by flashing and locking your attention directly on screen.</p>

    <label style="text-align: left; display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.4rem;">What should it yell at you?</label>
    <input type="text" id="msg" value="DO YOUR WORK NOW!">

    <label style="text-align: left; display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 0.4rem;">Interval (Seconds)</label>
    <input type="number" id="sec" value="3" min="1">

    <button id="startBtn" class="btn btn-start" onclick="startSpam()">START SPAMMING</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopSpam()">STOP (I'M WORKING)</button>
</div>

<script>
    let timer = null;

    function startSpam() {
        const seconds = parseInt(document.getElementById('sec').value) || 3;
        const text = document.getElementById('msg').value;
        
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('sec').disabled = true;
        document.getElementById('msg').disabled = true;

        timer = setInterval(() => {
            triggerChaos(text);
        }, seconds * 1000);
    }

    function triggerChaos(text) {
        // Flash background
        document.body.classList.add('flash-mode');
        
        // Show giant banner
        const alertBox = document.getElementById('topAlert');
        alertBox.textContent = text;
        alertBox.style.display = 'block';

        // Play a quick beep sound using web audio API (no external files needed)
        playBeep();

        // Turn off flash after 1 second so it doesn't cause a seizure, but keeps cycling
        setTimeout(() => {
            document.body.classList.remove('flash-mode');
            alertBox.style.display = 'none';
        }, 1500);
    }

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 440; // Pitch
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            setTimeout(() => { osc.stop(); }, 300);
        } catch (e) {
            // Audio context blocked if user hasn't interacted, ignore safely
        }
    }

    function stopSpam() {
        clearInterval(timer);
        document.body.classList.remove('flash-mode');
        document.getElementById('topAlert').style.display = 'none';
        
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('sec').disabled = false;
        document.getElementById('msg').disabled = false;
    }
</script>

</body>
</html>
